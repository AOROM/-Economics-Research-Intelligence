name: weekly literature email

on:
  push:
    branches:
      - main
  schedule:
    # GitHub cron uses UTC. Avoid the top of the hour, where scheduled
    # workflows are more likely to be delayed or dropped. Later entries are
    # idempotent recovery attempts; an accepted Monday period exits before a
    # second scan or email.
    - cron: "11 1 * * 1"  # Monday 09:11 Asia/Shanghai
    - cron: "37 3 * * 1"  # Monday 11:37 Asia/Shanghai
    - cron: "17 7 * * 1"  # Monday 15:17 Asia/Shanghai
  workflow_dispatch:
    inputs:
      initialize:
        description: Create encrypted baseline state on the first run
        required: false
        default: false
        type: boolean
      recovery:
        description: Deliver normally, mark a verified message accepted, or allow retry
        required: false
        default: deliver
        type: choice
        options:
          - deliver
          - accepted
          - retry
      recovery_period:
        description: Monday date (YYYY-MM-DD) for accepted/retry recovery
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: economics-research-intelligence-weekly-mail
  cancel-in-progress: false

jobs:
  smtp-config-check:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[smtp-config-check]') }}
    runs-on: ubuntu-latest
    env:
      RADAR_SMTP_USERNAME: ${{ secrets.RADAR_SMTP_USERNAME }}
      RADAR_SMTP_PASSWORD: ${{ secrets.RADAR_SMTP_PASSWORD }}
      RADAR_MAIL_TO: ${{ secrets.RADAR_MAIL_TO }}
    steps:
      - name: Validate SMTP secret shape without connecting to the mail server
        run: |
          python - <<'PY'
          import json
          import os
          import re

          username = os.environ.get("RADAR_SMTP_USERNAME", "").strip()
          recipient = os.environ.get("RADAR_MAIL_TO", "").strip()
          raw_code = os.environ.get("RADAR_SMTP_PASSWORD", "")
          code = raw_code.strip()
          report = {
              "authorization_code_length": len(code),
              "authorization_code_printable_ascii": bool(code) and all(33 <= ord(char) <= 126 for char in code),
              "authorization_code_surrounding_quotes": len(code) >= 2 and code[0] in "'\"" and code[-1] == code[0],
              "authorization_code_surrounding_whitespace": raw_code != code,
              "authorization_code_uppercase_letters_only": bool(re.fullmatch(r"[A-Z]{16}", code)),
              "recipient_configured": bool(recipient),
              "sender_matches_recipient": bool(username) and username.casefold() == recipient.casefold(),
              "username_is_full_163_address": bool(re.fullmatch(r"[^@\s]+@163\.com", username, re.IGNORECASE)),
          }
          print(json.dumps(report, sort_keys=True))
          valid = (
              report["authorization_code_printable_ascii"]
              and not report["authorization_code_surrounding_quotes"]
              and report["recipient_configured"]
              and report["sender_matches_recipient"]
              and report["username_is_full_163_address"]
          )
          raise SystemExit(0 if valid else 2)
          PY

  deliver:
    # Pushes run this job only for an explicit, auditable recovery commit.
    if: ${{ vars.RADAR_WEEKLY_ENABLED == 'true' && (github.event_name != 'push' || contains(github.event.head_commit.message, '[weekly-recovery]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
      RADAR_STATE_KEY: ${{ secrets.RADAR_STATE_KEY }}
      RADAR_SMTP_USERNAME: ${{ secrets.RADAR_SMTP_USERNAME }}
      RADAR_SMTP_PASSWORD: ${{ secrets.RADAR_SMTP_PASSWORD }}
      RADAR_MAIL_TO: ${{ secrets.RADAR_MAIL_TO }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install monitor
        run: python -m pip install -e ".[cloud]"
      - name: Initialize, scan, summarize, and deliver
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery == 'deliver' && inputs.initialize }}
        run: research-radar-weekly --config presets/corporate-finance-firm-boundaries.yaml --workdir .literature-monitor/corporate-finance-firm-boundaries --initialize
      - name: Scan, summarize, and deliver
        if: ${{ github.event_name != 'workflow_dispatch' || (inputs.recovery == 'deliver' && inputs.initialize != true) }}
        run: research-radar-weekly --config presets/corporate-finance-firm-boundaries.yaml --workdir .literature-monitor/corporate-finance-firm-boundaries
      - name: Resolve a verified uncertain delivery
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery != 'deliver' }}
        env:
          RECOVERY_PERIOD: ${{ inputs.recovery_period }}
          RECOVERY_OUTCOME: ${{ inputs.recovery }}
        run: research-radar-weekly --config presets/corporate-finance-firm-boundaries.yaml --workdir .literature-monitor/corporate-finance-firm-boundaries --resolve-period "$RECOVERY_PERIOD" --resolution "$RECOVERY_OUTCOME"

